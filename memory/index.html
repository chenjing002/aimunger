<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        /* ===== Memory App Styles ===== */

        #app { min-height: 60vh; }

        /* Loading */
        .mem-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 0;
            color: var(--color-text-secondary);
            font-size: 15px;
        }

        /* Login */
        .mem-login {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 100px 0 80px;
            text-align: center;
        }
        .mem-login-title {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .mem-login-desc {
            color: var(--color-text-secondary);
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 40px;
            max-width: 400px;
        }
        .mem-google-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 28px;
            background: #fff;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 500;
            color: var(--color-text);
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .mem-google-btn:hover {
            border-color: #ccc;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .mem-google-btn svg { width: 20px; height: 20px; }

        /* User bar */
        .mem-user-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--color-border);
        }
        .mem-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: var(--color-text-secondary);
        }
        .mem-user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
        }
        .mem-signout {
            font-size: 13px;
            color: var(--color-text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font-serif);
            padding: 4px 8px;
            border-radius: 4px;
            transition: color 0.2s;
        }
        .mem-signout:hover { color: var(--color-accent); }

        /* Page header */
        .mem-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 32px 0 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .mem-page-title {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 700;
        }
        .mem-page-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Tabs */
        .mem-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--color-border);
        }
        .mem-tab {
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-secondary);
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: var(--font-serif);
            transition: color 0.2s, border-color 0.2s;
            margin-bottom: -1px;
        }
        .mem-tab:hover { color: var(--color-text); }
        .mem-tab.active {
            color: var(--color-accent);
            border-bottom-color: var(--color-accent);
        }

        /* Deck grid */
        .mem-deck-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding-bottom: 48px;
        }
        .mem-deck-card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.25s;
            position: relative;
        }
        .mem-deck-card:hover {
            border-color: var(--color-accent);
            box-shadow: 0 4px 16px rgba(139,37,0,0.06);
            transform: translateY(-1px);
        }
        .mem-deck-card.paused { opacity: 0.55; }
        .mem-deck-title {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .mem-deck-meta {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }
        .mem-deck-due {
            display: inline-block;
            padding: 2px 8px;
            background: #fef2f2;
            color: var(--color-accent);
            font-size: 12px;
            font-weight: 600;
            border-radius: 4px;
            margin-bottom: 4px;
        }
        .mem-deck-next {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-bottom: 4px;
        }
        .mem-deck-paused-badge {
            display: inline-block;
            padding: 2px 8px;
            background: var(--color-surface);
            color: var(--color-text-secondary);
            font-size: 12px;
            font-weight: 500;
            border-radius: 4px;
        }

        /* Stage distribution bar */
        .mem-stage-bar {
            display: flex;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
            background: var(--color-border);
        }
        .mem-stage-bar-seg {
            height: 100%;
            transition: width 0.3s ease;
        }

        /* Stats row */
        .mem-stats {
            display: flex;
            gap: 32px;
            padding: 16px 0;
            flex-wrap: wrap;
        }
        .mem-stat {
            text-align: center;
        }
        .mem-stat-value {
            font-size: 22px;
            font-weight: 700;
            font-family: var(--font-serif);
        }
        .mem-stat-label {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-top: 2px;
        }

        /* Detail page */
        .mem-back {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            color: var(--color-text-secondary);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: var(--font-serif);
            padding: 0;
            margin-top: 24px;
            transition: color 0.2s;
        }
        .mem-back:hover { color: var(--color-accent); }

        .mem-detail-title {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 700;
            margin: 12px 0 4px;
            line-height: 1.4;
        }
        .mem-detail-status {
            font-size: 13px;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
        }
        .mem-detail-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 28px;
            padding-top: 4px;
        }
        .mem-detail-actions-primary {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mem-detail-actions-secondary {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .mem-btn-danger-text {
            color: #dc2626;
        }
        .mem-btn-danger-text:hover {
            color: #dc2626;
            background: #fef2f2;
        }

        /* Stage legend */
        .mem-stage-legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0 20px;
            font-size: 12px;
            color: var(--color-text-secondary);
        }
        .mem-stage-legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .mem-stage-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Card list */
        .mem-card-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--color-border);
            border: 1px solid var(--color-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 48px;
        }
        .mem-card-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 20px;
            background: var(--color-card-bg);
            transition: background 0.15s;
        }
        .mem-card-item:hover {
            background: var(--color-surface);
        }
        .mem-card-content { flex: 1; min-width: 0; }
        .mem-card-num {
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-right: 6px;
            font-weight: 500;
        }
        .mem-card-question {
            font-size: 14px;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .mem-card-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 6px;
            font-size: 12px;
            color: var(--color-text-secondary);
        }
        .mem-card-actions-inline {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            align-items: flex-start;
            padding-top: 2px;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .mem-card-item:hover .mem-card-actions-inline {
            opacity: 1;
        }
        .mem-icon-btn {
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: color 0.2s, background 0.2s;
        }
        .mem-icon-btn:hover {
            color: var(--color-accent);
            background: rgba(139,37,0,0.06);
        }

        /* Stage badge */
        .mem-stage-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .mem-stage-0 { background: #f3f4f6; color: #6b7280; }
        .mem-stage-1 { background: #fef3c7; color: #92400e; }
        .mem-stage-2 { background: #fde68a; color: #78350f; }
        .mem-stage-3 { background: #d1fae5; color: #065f46; }
        .mem-stage-4 { background: #dbeafe; color: #1e40af; }
        .mem-stage-5 { background: #fef2f2; color: #8b2500; }

        /* Review mode */
        .mem-review {
            padding: 24px 0 48px;
        }
        .mem-review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .mem-review-count {
            font-size: 14px;
            color: var(--color-text-secondary);
            font-variant-numeric: tabular-nums;
        }
        .mem-review-progress {
            height: 3px;
            background: var(--color-border);
            border-radius: 2px;
            margin-bottom: 28px;
            overflow: hidden;
        }
        .mem-review-progress-fill {
            height: 100%;
            background: var(--color-accent);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .mem-review-card {
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 32px 28px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
        }
        .mem-review-stage {
            margin-bottom: 16px;
        }
        .mem-review-question {
            font-family: var(--font-serif);
            font-size: 17px;
            line-height: 1.9;
            flex: 1;
        }
        .mem-review-divider {
            border: none;
            border-top: 1px dashed var(--color-border);
            margin: 20px 0;
        }
        .mem-review-answer {
            font-family: var(--font-serif);
            font-size: 16px;
            line-height: 1.9;
            color: var(--color-text);
            padding: 8px 0 12px;
        }
        .mem-review-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .mem-review-actions .mem-btn { flex: 1; }
        .mem-review-btn-fail,
        .mem-review-btn-pass {
            flex-direction: column;
            gap: 2px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 15px;
        }
        .mem-review-btn-fail {
            color: #dc2626;
            border-color: #fecaca;
            background: #fff;
        }
        .mem-review-btn-fail:hover {
            background: #fef2f2;
            border-color: #dc2626;
        }
        .mem-review-btn-pass {
            background: #059669;
            color: #fff;
            border-color: #059669;
        }
        .mem-review-btn-pass:hover {
            background: #047857;
            border-color: #047857;
        }
        .mem-review-btn-label {
            font-weight: 600;
            font-size: 15px;
        }
        .mem-review-btn-key {
            font-size: 11px;
            opacity: 0.6;
            font-weight: 400;
        }
        .mem-review-btn-show {
            padding: 14px 40px;
            font-size: 15px;
            border-radius: 10px;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
        }
        .mem-review-btn-show:hover {
            border-color: var(--color-accent);
            color: var(--color-accent);
        }
        .mem-review-show {
            display: flex;
            justify-content: center;
            margin-top: 24px;
        }
        .mem-review-hint {
            text-align: center;
            font-size: 12px;
            color: var(--color-text-secondary);
            margin-top: 10px;
            opacity: 0.7;
        }

        /* Review summary */
        .mem-review-summary {
            text-align: center;
            padding: 60px 0;
        }
        .mem-review-summary-title {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .mem-review-summary-rate {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 24px;
        }
        .mem-review-summary-stats {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin: 0 0 32px;
        }
        .mem-summary-stat-value {
            font-size: 32px;
            font-weight: 700;
            font-family: var(--font-serif);
        }
        .mem-summary-stat-value.pass { color: #059669; }
        .mem-summary-stat-value.fail { color: var(--color-accent); }
        .mem-summary-stat-label {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        /* Import */
        .mem-import-section { padding-bottom: 48px; }
        .mem-import-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 16px;
            line-height: 1.7;
        }
        .mem-import-format {
            font-size: 13px;
            color: var(--color-text-secondary);
            background: var(--color-surface);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.7;
            font-family: monospace;
        }
        .mem-import-preview {
            margin-top: 20px;
        }
        .mem-import-preview-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .mem-import-preview-card {
            background: var(--color-surface);
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.6;
        }
        .mem-import-preview-q { font-weight: 600; margin-bottom: 4px; }
        .mem-import-preview-a { color: var(--color-text-secondary); }

        /* Modal */
        .mem-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.35);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .mem-modal {
            background: var(--color-card-bg);
            border-radius: 14px;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 16px 48px rgba(0,0,0,0.12);
        }
        .mem-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px 0;
        }
        .mem-modal-title {
            font-family: var(--font-serif);
            font-size: 17px;
            font-weight: 700;
        }
        .mem-modal-close {
            width: 32px; height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            color: var(--color-text-secondary);
            cursor: pointer;
            font-size: 18px;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .mem-modal-close:hover { background: var(--color-surface); }
        .mem-modal-body { padding: 20px 24px; }
        .mem-modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 24px 20px;
        }

        /* Form */
        .mem-field { margin-bottom: 16px; }
        .mem-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-text-secondary);
            margin-bottom: 6px;
        }
        .mem-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: var(--font-serif);
            font-size: 15px;
            color: var(--color-text);
            background: var(--color-bg);
            outline: none;
            transition: border-color 0.2s;
        }
        .mem-input:focus { border-color: var(--color-accent); }
        .mem-textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: var(--font-serif);
            font-size: 14px;
            color: var(--color-text);
            background: var(--color-bg);
            outline: none;
            resize: vertical;
            min-height: 100px;
            line-height: 1.7;
            transition: border-color 0.2s;
        }
        .mem-textarea:focus { border-color: var(--color-accent); }

        /* Buttons */
        .mem-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 18px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-family: var(--font-serif);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--color-card-bg);
            color: var(--color-text);
            white-space: nowrap;
        }
        .mem-btn:hover { border-color: #ccc; }
        .mem-btn-primary {
            background: var(--color-accent);
            color: #fff;
            border-color: var(--color-accent);
        }
        .mem-btn-primary:hover {
            background: #6d1d00;
            border-color: #6d1d00;
        }
        .mem-btn-danger {
            color: #dc2626;
            border-color: #fecaca;
        }
        .mem-btn-danger:hover {
            background: #fef2f2;
            border-color: #dc2626;
        }
        .mem-btn-ghost {
            border-color: transparent;
            background: transparent;
            color: var(--color-text-secondary);
        }
        .mem-btn-ghost:hover {
            background: var(--color-surface);
            color: var(--color-text);
        }
        .mem-btn-sm {
            padding: 5px 12px;
            font-size: 13px;
        }
        .mem-btn-lg {
            padding: 12px 28px;
            font-size: 16px;
        }

        /* Empty state */
        .mem-empty {
            text-align: center;
            padding: 60px 0;
        }
        .mem-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        .mem-empty-title {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .mem-empty-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 24px;
        }

        /* Toast */
        .mem-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--color-text);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font-serif);
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .mem-toast.show { opacity: 1; }

        /* Confirm dialog */
        .mem-confirm-text {
            font-size: 15px;
            line-height: 1.7;
            color: var(--color-text);
            margin-bottom: 8px;
        }
        .mem-confirm-sub {
            font-size: 13px;
            color: var(--color-text-secondary);
        }

        /* Review history */
        .mem-history {
            margin-top: 8px;
        }
        .mem-history-item {
            font-size: 12px;
            color: var(--color-text-secondary);
            padding: 2px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
