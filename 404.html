<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>页面不存在 - aimunger</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <script>
    // The LLM Reader subsite was removed; send its old deep links to the
    // article section instead of a dead end.
    if (location.pathname.indexOf('/llm-reader/') === 0) {
        location.replace('/blog/');
    }
    </script>
    <style>
        .notfound {
            text-align: center;
            padding: 80px 20px 60px;
        }
        .notfound-code {
            font-family: var(--font-serif);
            font-size: 64px;
            font-weight: 700;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
        }
        .notfound-title {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .notfound-desc {
            color: var(--color-text-secondary);
            font-size: 15px;
            margin-bottom: 36px;
        }
        .notfound-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .notfound-links a {
            display: inline-block;
            padding: 8px 18px;
            border: 1px solid var(--color-border);
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            color: var(--color-text);
            transition: all 0.2s;
        }
        .notfound-links a:hover {
            color: var(--color-accent);
            border-color: var(--color-accent);
        }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="/" class="logo">
                <span class="logo-icon">M</span>

                <li><a href="/about/">关于</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <div class="notfound">
                <div class="notfound-code">404</div>
                <h1 class="notfound-title">页面不存在</h1>
                <p class="notfound-desc">你访问的页面可能已被移动或删除。</p>
                <div class="notfound-links">
