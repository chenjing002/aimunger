    <style>
        /* ===== Groups grid ===== */
        #view-groups { padding-bottom: 72px; }

        .groups-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 260px));
            gap: 28px;
            justify-content: center;
        }

        .group {
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        /* Promote the whole group's stacking order the instant it is hovered,
           so its fanned-out background cards sit above the adjacent stack
           immediately — no z-index transition, only transform/shadow animate. */
        .group:hover {
            z-index: 10;
        }

        .group-stack {
            position: relative;
            aspect-ratio: 1 / 1.25;
            margin-bottom: 30px;
        }

        .group-stack-layer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 100%;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 14px;
            box-shadow: 0 2px 6px rgba(16,15,15,0.06);
            transform-origin: 50% 100%;
            transition: bottom 0.4s cubic-bezier(0.34,1.56,0.64,1),
                        left 0.4s cubic-bezier(0.34,1.56,0.64,1),
                        right 0.4s cubic-bezier(0.34,1.56,0.64,1),
                        transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
                        opacity 0.35s ease,
                        box-shadow 0.35s ease;
        }

        /* Furthest back card */
        .group-stack-layer:nth-child(1) {
            left: 12px; right: 12px;
            bottom: -16px;
            opacity: 0.4;
            z-index: 0;
        }
        /* Middle card */
        .group-stack-layer:nth-child(2) {
            left: 6px; right: 6px;
            bottom: -8px;
            opacity: 0.65;
            z-index: 1;
        }
        /* Near card */
        .group-stack-layer:nth-child(3) {
            left: 2px; right: 2px;
            bottom: -4px;
            opacity: 0.85;
            z-index: 2;
        }

        .group-stack-front {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 14px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 24px 22px;
            box-shadow: 0 2px 8px rgba(16,15,15,0.06);
            transition: border-color 0.3s ease,
                        box-shadow 0.4s cubic-bezier(0.23,1,0.32,1),
                        transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
            overflow: hidden;
        }

        .group-stack-front .front-q {
            font-size: 14px;
            line-height: 1.8;
            color: var(--color-text);
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .front-badge {
            display: inline-block;
            width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            background: var(--color-accent);
            border-radius: 4px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .group:hover .group-stack-front {
            border-color: var(--color-accent);
            box-shadow: 0 8px 32px rgba(139,37,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
            transform: translateY(-9px) scale(1.03);
        }
        /* Radial fan: layers splay open behind the front card like a hand of cards */
        .group:hover .group-stack-layer:nth-child(1) {
            left: 6px; right: 6px;
            bottom: -10px;
            opacity: 0.55;
            transform: rotate(-17deg) translateY(-8px);
        }
        .group:hover .group-stack-layer:nth-child(2) {
            left: 6px; right: 6px;
            bottom: -6px;
            opacity: 0.8;
            transform: rotate(17deg) translateY(-8px);
        }
        .group:hover .group-stack-layer:nth-child(3) {
            left: 2px; right: 2px;
            bottom: -3px;
            opacity: 0.95;
            transform: rotate(-6deg) translateY(-14px);
        }

        .group-meta { text-align: center; }
        .group-title {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 600;
            line-height: 1.5;
            color: var(--color-text);
            margin-bottom: 4px;
        }
        .group-count {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        /* ===== Overlay ===== */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
        }
        .overlay.active {
            pointer-events: auto;
            opacity: 1;
        }

        .overlay-bg {
            position: absolute;
            inset: 0;
            background: rgba(250,250,249,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .overlay.active .overlay-bg { opacity: 1; }

        .overlay-content {
            position: relative;
            z-index: 1;
            width: 92%;
            max-width: 560px;
            height: 88vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 16px;
            transform: scale(0.92) translateY(20px);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1),
                        opacity 0.3s ease;
        }
        .overlay.active .overlay-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        /* Scrollable card body */
        .review-scroll-body {
            flex: 1;
            overflow-y: auto;
            -ms-overflow-style: none;
            scrollbar-width: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 8px 0 12px;
        }
        .review-scroll-body::-webkit-scrollbar { display: none; }

        /* ===== Review card in overlay ===== */
        .review-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .review-title {
            font-family: var(--font-serif);
            font-size: 17px;
            font-weight: 600;
            color: var(--color-text);
            line-height: 1.4;
            flex: 1;
            margin-right: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .review-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0,0,0,0.06);
            border: none;
            color: var(--color-text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .review-close:hover { background: rgba(0,0,0,0.1); }

        .review-progress {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
        }
        .progress-bar {
            flex: 1;
            height: 2px;
            background: rgba(0,0,0,0.08);
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--color-accent);
            border-radius: 2px;
            transition: width 0.4s cubic-bezier(0.23,1,0.32,1);
        }
        .progress-text {
            font-size: 12px;
            color: var(--color-text-secondary);
            white-space: nowrap;
        }

        .card-stage {
            position: relative;
            perspective: 1000px;
        }
        .card-stack-layer {
            position: absolute;
            left: 0; right: 0;
            top: 0;
            height: 100%;
            background: var(--color-card-bg);
            border: 1px solid var(--color-border);
            border-radius: 16px;
            box-shadow: none;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.23,1,0.32,1), opacity 0.4s ease;
        }
        .group-stack-layer.accent,
        .card-stack-layer.accent {
            background: #8b2500;
            border-color: rgba(139,37,0,0.5);
        }
        /* Time-machine stack: upcoming cards recede into depth behind the active card */
        .card-stack-layer.stack-far {
            left: 22px; right: 22px;
            top: auto; bottom: 0;
            transform-origin: 50% 100%;
            transform: translateY(20px) scale(0.9) rotateX(-9deg);
            opacity: 0.2;
            z-index: 0;
        }
        .card-stack-layer.stack-near {
            left: 11px; right: 11px;
            top: auto; bottom: 0;
            transform-origin: 50% 100%;
            transform: translateY(10px) scale(0.95) rotateX(-5deg);
            opacity: 0.5;
            box-shadow: 0 -6px 16px rgba(0,0,0,0.04);
            z-index: 1;
        }

        .review-card {
            position: relative;
            z-index: 2;
            background: var(--color-card-bg);
            border: 1px solid #8b2500;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            animation: cardEnter 0.22s ease-out both;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: none; }
        }

        .review-q {
            padding: 28px 28px 24px;
            font-size: 16px;
            line-height: 1.9;
            color: var(--color-text);
        }
        .review-q-badge {
            display: inline-block;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            background: var(--color-accent);
            border-radius: 4px;
            margin-right: 10px;
            vertical-align: middle;
        }

        .review-a {
            border-top: 1px solid var(--color-border);
            padding: 24px 28px;
        }
        .review-a-inner {
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .review-a.visible .review-a-inner {
            opacity: 1;
        }
        .review-a-badge {
            display: inline-block;
            width: 22px;
            height: 22px;
            line-height: 22px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--color-accent);
            background: var(--color-surface);
            border-radius: 4px;
            margin-right: 10px;
            vertical-align: middle;
        }
        .review-a-text {
            font-size: 15px;
            line-height: 1.9;
            color: var(--color-text-secondary);
        }

        /* Accent (dark-red) front card */
        .review-card.accent {
            background: #8b2500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .review-card.accent .review-q {
            color: rgba(255,255,255,0.92);
        }
        .review-card.accent .review-q-badge {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        .review-card.accent .review-a {
            border-top-color: rgba(255,255,255,0.15);
        }
        .review-card.accent .review-a-badge {
            background: rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.9);
        }
        .review-card.accent .review-a-text {
            color: rgba(255,255,255,0.72);
        }

        /* Action area below card */
        .review-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 48px;
            min-height: 44px;
        }

        .btn-action {
            padding: 10px 28px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: transparent;
            font-family: var(--font-serif);
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-action:hover {
            background: var(--color-surface);
            border-color: var(--color-text-secondary);
        }
        .btn-action:active { transform: scale(0.96); }

        .btn-action.primary {
            background: var(--color-text);
            border-color: transparent;
            color: #fff;
        }
        .btn-action.primary:hover {
            background: #333;
        }

        /* Nav dots */
        .review-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 16px;
        }
        .nav-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .nav-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(0,0,0,0.12);
            transition: background 0.2s ease, transform 0.2s ease;
        }
        .nav-dot.active {
            background: var(--color-text);
            transform: scale(1.3);
        }

        .hint-keys {
            text-align: center;
            margin-top: 16px;
            font-size: 11px;
            color: var(--color-text-secondary);
            opacity: 0.6;
            white-space: nowrap;
        }

        /* Completion screen */
        .completion-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        .completion-title {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            color: var(--color-text);
            margin-bottom: 10px;
        }
        .completion-desc {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 36px;
        }
        .completion-actions {
            display: flex;
            gap: 12px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .groups-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 20px;
            }
            .overlay-content { width: 95%; }
            .review-q, .review-a { padding-left: 22px; padding-right: 22px; }
            .review-q { padding-top: 22px; padding-bottom: 18px; }
            .review-a { padding-top: 18px; padding-bottom: 22px; }
            .hint-keys { display: none; }
        }
    </style>
</head>

    <script>
    var DECKS = [{"title":"恒隆地产 2018 年报致股东信","cards":[{"q":"2018 年恒隆收入下降 16%，但股东应佔纯利几乎不变。为何两者走势分叉？","a":"因为纯利对应的是租赁收入（稳定），而收入下降来自可售住宅减少（一次性）；两者性质不同，不应混读。"},{"q":"扣除物业重估收益后，2018 年基本纯利下跌幅度是多少，与表面纯利变动相比说明什么？","a":"基本纯利减少 26%，远大于表面纯利「低于 1%」的降幅。说明重估收益大幅掩盖了经营层面的真实压力，必须看基本数字才能评估实际表现。"},{"q":"上海恒隆广场完成大翻新后，租金在随后两年分别增长多少？","a":"2017 年增长逾 20%，2018 年进一步增长 12%（即翻新后第二年仍有显著增长，非一次性反弹）。"},{"q":"资产优化计划的核心机制是什么——为何翻新能推动租金大幅上升？","a":"提升档次吸引顶级奢侈品牌进驻；头部品牌的「羊群效应」带动其他品牌跟进；租户愿意支付更高租金，同时已有租户续约意愿更强。"},{"q":"港匯恒隆广场资产优化期间，为何收入会暂时下降？","a":"19% 的优质楼面空间关闭施工，无法产生租金。这是战略性短期牺牲，换取未来更高租金定位。"},{"q":"2020 年租金收入「大幅上升」由哪四重来源驱动？","a":"①资产优化计划完成（尤其港匯）；②新物业落成（武漢、昆明等）；③租户优化（引入更多顶级品牌）；④正常租金调升。"},{"q":"新增可租赁空间总面积超过多少平方米，这个数字有何战略意义？","a":"超过 710,000 平方米；意义在于这些空间全部属于顶级购物商场或甲级办公楼，并非普通增量——规模与质量同时放大。"},{"q":"管理层签订的新奢侈品牌租约共约多少份，其中上海以外占多少比例？","a":"超过 30 份；约三分之二位于上海以外。这打破了「只有上海才能吸引顶级品牌」的刻板印象。"},{"q":"2014 年至 2016 年底，人民币兑美元大致经历了怎样的走势？","a":"2014 年底约 6.0（接近高点），到 2016 年底跌至约 7.0——两年内大幅贬值约 17%，对以人民幣计价的资产具有重大港元换算影响。"},{"q":"恒隆杭州拿地后如何对冲汇率风险，锁汇操作最终节省了多少？","a":"2018 年 5 月拿地时汇率为 6.37，将余款支付汇率锁定于 6.85，实际支付时汇率接近 6.95；锁汇操作节省近 10 亿港元。"},{"q":"锁汇节省 10 亿港元这个结果说明什么，陈啟宗本人如何评价这次操作？","a":"他明确说「运气好」，并强调公司从事地产而非货币投机——此类操作的目标是减低风险，而非押注方向；侥幸不等于策略。"},{"q":"2018 年中国个人消费增长率约为多少，这是多少年来的最低点？","a":"略高于 8%，为 15 年来最低；但陈啟宗指出 2004–2017 年年均 13% 本不可持续，8% 仍算可观——重要的是不要用不正常的高增长作为基准。"},{"q":"2018 年奢侈品消费与大众消费出现了什么分叉？","a":"大众消费有转弱趋势，但奢侈品消费反向增长——顶级品牌重新在内地扩充门店，印证高端消费韧性强于整体消费。"},{"q":"中央政府哪些政策措施有助于将海外高端消费引回国内？","a":"调低进口税、不鼓励赴海外购物、提高个人所得税免税额；平均关税下调约 9%，直接压低国内售价，缩小与海外价差。"},{"q":"海外高端消费回流的潜力有多大？用信中的数据说明。","a":"海外客源消费曾占奢侈品总销售约四分之三；仅靠回流，无需新增客群，内地市场理论上即可「轻易翻倍」。"},{"q":"陈啟宗认为中美贸易战的「深层矛盾」是什么？","a":"贸易只是工具，根本是美国感到霸权受威胁的政治角力。贸易问题即使解决，冲突也会转移到其他领域，必须以政治手段化解。"},{"q":"按照陈啟宗的分析，贸易战反而可能对恒隆有利的逻辑是什么？","a":"北京担忧 GDP 受损，因而推出刺激消费政策（取消限购、注入流动性、扩大免税额），这些措施直接利好高端零售；同时消费者可能减少海外购物而转向国内。"},{"q":"陈啟宗对中美角力提出了哪两个具体的「乌云」风险点？","a":"①特朗普借攻击中国转移国内法律困境，局势可能失控；②中国若短期内寻求收回台湾，即使以和平方式，也会令关系大幅恶化。"},{"q":"当我看到某商业地产公司「收入大跌但利润平稳」时，应该首先问什么问题？","a":"先分清收入结构——是租赁（经常性）还是售楼（一次性）？再看基本利润是否也同样平稳，避免被表面纯利数字遮蔽经营质量的变化。"},{"q":"当我看到一个顶级品牌开始大规模进入某二线城市购物商场时，应该怎样解读这个信号？","a":"这往往是羊群效应的起点——头部品牌已完成选址调研并押注于此，其他品牌往往跟进；这是该购物商场升级定位的早期领先指标。"}],"file":"2.md"},{"title":"恒隆地产 2019 中期报告董事长致股东函","cards":[{"q":"恒隆把高端商业地产成功的五个先决条件称作什么？这个称呼暗示了什么性质？","a":"“地产业基因”。暗示项目一旦“诞生”便无法更改——对错都已定型（如矮个子进不了顶级篮球联赛）。"},{"q":"五个地产业基因，按次序：地点、规模、___、设计、施工？","a":"发展大纲（政府制定的发展条款；陈启宗视其为决定项目成败的关键）。"},{"q":"“硬件比软件更重要”在恒隆业务里具体意味着什么？（硬件、软件各指什么）","a":"硬件＝五个基因；软件＝租户与商品组合。基因有缺陷的项目无竞争时尚可，一旦遇上良好基因的对手便吃苦甚至倒闭；软件无法弥补硬件缺陷。"},{"q":"龙头地位什么时候是脆弱的，什么时候才相对稳固？","a":"若领先只因首个进场、或因对手基因弱，则脆弱，遇强基因对手会被取代；唯有自身基因优良，龙头地位才相对易守。"},{"q":"恒隆物业的“灵活性”建立在哪一种不对称上？举一例。","a":"高档可降级、低档不能升级。例：五星商场可改成二三星，反之不行；商场结构可改成百货公司，但百货公司结构改不回商场。"},{"q":"为什么恒隆认为电商对它的威胁较小？","a":"它专营奢侈品；商品单价越高越难在网上成交——高级时装、珠宝、名表都要到实体店检视后才购买。"},{"q":"在优越地段开实体旗舰店，对在线起家的品牌有什么可量化的好处？","a":"提升品牌信誉，可令产品单价提高达 20%；因此这类品牌常以恒隆物业为首选落户点。"},{"q":"这模式“概念简单、执行极难”，最难的究竟是什么？用杭州的例子说明。","a":"难在纪律与耐性（长远眼光）。杭州地块自 1990 年代初物色，一直等到 2018 年才出手；手握现金时，“忍住不买”比买更难。"},{"q":"上海两个项目落成约十年后，非杠杆混合总租金回报（相对原始成本）大约是多少？","a":"略超 30%（资产优化期间一度逾 45%；零售回报远高于办公楼）。"},{"q":"为什么这套长线策略特别适合家族控股的上市公司？","a":"管理层基本不会被撤换，能放眼长远，不必为刺激短期股价而牺牲长期前景。（陈启宗：若非控股股东代表，公众投资者未必给他十年时间扭转公司）"},{"q":"据陈启宗（2019 中期），为何香港社会动荡对恒隆零售业务的冲击相对较小？","a":"因其香港租户主要供应本地市民日常所需，而非依赖访港旅客的奢侈品消费。"}],"file":"1.md"}];

    var grid = document.getElementById('groups-grid');
    var overlay = document.getElementById('overlay');
    var overlayBg = document.getElementById('overlay-bg');
    var overlayContent = document.getElementById('overlay-content');

    var currentDeck = null;
    var currentIndex = 0;
    var answerRevealed = false;
    var transitioning = false;

    function esc(s) {
        var d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    // --- Build groups grid ---
    DECKS.forEach(function(deck, di) {
        var group = document.createElement('div');
        group.className = 'group';

        var stack = document.createElement('div');
        stack.className = 'group-stack';
        stack.innerHTML =
            '<div class="group-stack-layer accent"></div>' +
            '<div class="group-stack-layer"></div>' +
            '<div class="group-stack-layer accent"></div>' +
            '<div class="group-stack-front">' +
                '<span class="front-badge">Q</span>' +
                '<div class="front-q">' + esc(deck.cards[0].q) + '</div>' +
            '</div>';

        var meta = document.createElement('div');
        meta.className = 'group-meta';
        meta.innerHTML =
            '<div class="group-title">' + esc(deck.title) + '</div>' +
            '<div class="group-count">' + deck.cards.length + ' 张卡片</div>';

        group.appendChild(stack);
        group.appendChild(meta);
        group.addEventListener('click', function() { openDeck(di); });
        grid.appendChild(group);
    });

    // --- Open deck overlay ---
    function openDeck(di) {
        currentDeck = di;
        currentIndex = 0;
        answerRevealed = false;
        renderCard();
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeDeck() {
        overlay.classList.remove('active');
        document.body.style.overflow = '';
        currentDeck = null;
    }

    overlayBg.addEventListener('click', closeDeck);

    function cardHTML(card, idx) {
        var accentClass = (idx % 2 !== 0) ? ' accent' : '';
        return '<div class="review-card' + accentClass + '">' +
            '<div class="review-q">' +
                '<span class="review-q-badge">Q</span>' +
                esc(card.q) +
            '</div>' +
            '<div class="review-a" id="review-a">' +
                '<div class="review-a-inner">' +
                    '<span class="review-a-badge">A</span>' +
                    '<span class="review-a-text">' + esc(card.a) + '</span>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function goTo(idx, direction) {
        if (transitioning) return;
        var deck = DECKS[currentDeck];
        if (idx < 0 || idx >= deck.cards.length) return;

        var stageEl = document.querySelector('.card-stage');
        var oldCard = stageEl && stageEl.querySelector('.review-card');
        if (!oldCard) { currentIndex = idx; answerRevealed = false; renderCard(); return; }

        transitioning = true;
        oldCard.style.transformOrigin = '50% 0%';
        oldCard.style.transition = 'opacity 0.24s ease, transform 0.24s cubic-bezier(0.34,1.56,0.64,1)';
        oldCard.style.transform = 'translateY(30px) scale(1.05) rotateX(-10deg)';
        oldCard.style.opacity = '0';

        setTimeout(function() {
            currentIndex = idx;
            answerRevealed = false;
            renderCard();
            transitioning = false;
        }, 240);
    }

    function renderCard() {
        var deck = DECKS[currentDeck];
        var total = deck.cards.length;
        var card = deck.cards[currentIndex];
        var remaining = total - currentIndex - 1;
        var pct = Math.round(((currentIndex + 1) / total) * 100);

        // Dots (max 15 visible)
        var dotsHtml = '';
        if (total <= 15) {
            for (var i = 0; i < total; i++) {
                dotsHtml += '<span class="nav-dot' + (i === currentIndex ? ' active' : '') + '"></span>';
            }
        }

        overlayContent.innerHTML =
            '<div class="review-header">' +
                '<div class="review-title">' + esc(deck.title) + '</div>' +
                '<button class="review-close" id="btn-close">&times;</button>' +
            '</div>' +
            '<div class="review-progress">' +
                '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
                '<span class="progress-text">' + (currentIndex + 1) + ' / ' + total + '</span>' +
            '</div>' +
            '<div class="review-scroll-body">' +
                '<div class="card-stage">' +
                    (remaining >= 2 ? '<div class="card-stack-layer stack-far' + ((currentIndex + 2) % 2 !== 0 ? ' accent' : '') + '"></div>' : '') +
                    (remaining >= 1 ? '<div class="card-stack-layer stack-near' + ((currentIndex + 1) % 2 !== 0 ? ' accent' : '') + '"></div>' : '') +
                    cardHTML(card, currentIndex) +
                '</div>' +
                '<div class="review-actions" id="action-area"></div>' +
            '</div>' +
            (dotsHtml ? '<div class="review-nav"><div class="nav-dots">' + dotsHtml + '</div></div>' : '') +
            '<div class="hint-keys">Space 显示答案 <span style="font-family:monospace">&middot;</span> &larr; &rarr; 切换</div>';

        document.getElementById('btn-close').addEventListener('click', closeDeck);

        renderAction();
    }

    function renderAction() {
        var area = document.getElementById('action-area');
        if (!area) return;
        if (!answerRevealed) {
            area.innerHTML = '<button class="btn-action primary" id="btn-show">显示答案</button>';
            document.getElementById('btn-show').addEventListener('click', revealAnswer);
        } else {
            var isLast = currentIndex >= DECKS[currentDeck].cards.length - 1;
            if (isLast) {
                area.innerHTML = '<button class="btn-action primary" id="btn-complete">完成 ✓</button>';
                document.getElementById('btn-complete').addEventListener('click', showCompletion);
            } else {
                area.innerHTML = '<button class="btn-action primary" id="btn-next-card">下一张 →</button>';
                document.getElementById('btn-next-card').addEventListener('click', function() {
                    goTo(currentIndex + 1, 'next');
                });
            }
        }
    }

    function revealAnswer() {
        if (answerRevealed) return;
        answerRevealed = true;
        var el = document.getElementById('review-a');
        if (el) el.classList.add('visible');
        renderAction();
    }

    function showCompletion() {
        var deck = DECKS[currentDeck];
        overlayContent.innerHTML =
            '<div class="completion-screen">' +
                '<div class="completion-title">完成</div>' +
                '<div class="completion-desc">已复习完这组的 ' + deck.cards.length + ' 张卡片</div>' +
                '<div class="completion-actions">' +
                    '<button class="btn-action" id="btn-restart">重新开始</button>' +
                    '<button class="btn-action primary" id="btn-close-done">关闭</button>' +
                '</div>' +
            '</div>';
        document.getElementById('btn-restart').addEventListener('click', function() {
            currentIndex = 0;
            answerRevealed = false;
            renderCard();
        });
        document.getElementById('btn-close-done').addEventListener('click', closeDeck);
    }

    // --- Touch swipe ---
    var touchStartX = 0;
    overlayContent.addEventListener('touchstart', function(e) {
        touchStartX = e.touches[0].clientX;
    }, { passive: true });
    overlayContent.addEventListener('touchend', function(e) {
        if (currentDeck === null) return;
        var dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 44) {
            if (dx < 0) goTo(currentIndex + 1, 'next');
            else goTo(currentIndex - 1, 'prev');
        }
    }, { passive: true });

    // --- Keyboard ---
    document.addEventListener('keydown', function(e) {
        if (currentDeck === null) return;

        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            if (!answerRevealed) revealAnswer();
            else goTo(currentIndex + 1, 'next');
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            goTo(currentIndex + 1, 'next');
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            goTo(currentIndex - 1, 'prev');
        } else if (e.key === 'Escape') {
            e.preventDefault();
            closeDeck();
        }
    });
    </script>
</body>
