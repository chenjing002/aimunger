name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [subsite-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aimunger
        uses: actions/checkout@v4
        with:
          # Full history so generators can derive real publish/modified dates
          # from git (archival posts carry historical dates in frontmatter).
          fetch-depth: 0

      - name: Checkout letters-to-shareholders
        uses: actions/checkout@v4
        with:
          repository: chenjing002/letters-to-shareholders
          path: _build/letters

      # Data source only: generate-qa.js reads qa.html from this checkout to
      # build /blog/. The llm-reader pages themselves are no longer published.
      - name: Checkout llm-reader
        uses: actions/checkout@v4
        with:
          repository: chenjing002/llm-reader
          path: _build/llm-reader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: _build/letters/package-lock.json

      - name: Build letters site
        working-directory: _build/letters
        run: |
          sed -i "s|base: '/letters-to-shareholders/'|base: '/letters/'|" astro.config.mjs
          sed -i "s|site: 'https://chenjing002.github.io'|site: 'https://aimunger.com'|" astro.config.mjs
          npm ci
          npm run build

      - name: Build MD&A site
        working-directory: management-discussion-analysis
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html 404.html style.css favicon.svg CNAME llm.txt memory-notify.js ads.txt _site/
          # llm-reader here is noindex redirect stubs only (old indexed URLs
          # → / and /blog/), not the removed subsite content.
          cp -r about contact privacy disclaimer resources data memory blog llm-reader _site/
          rm -rf _site/memory/worker
          cp -r _build/letters/dist/ _site/letters/
          cp -r management-discussion-analysis/dist/ _site/management-discussion-analysis/

      - name: Generate Wiki pages
        run: node generate-wiki.js

      - name: Generate QA pages from QA data
        run: node generate-qa.js

      - name: Generate ankicard page from QA files
        run: node generate-ankicard.js

      - name: Generate agent-friendly markdown endpoints
        run: node generate-agent-content.js

      - name: Generate sitemap, robots.txt, and RSS
        run: |
          node generate-sitemap.js
          node generate-rss.js
          cp robots.txt _site/robots.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
