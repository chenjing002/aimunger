<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍推荐 - aimunger</title>
    <meta name="description" content="精选投资与商业相关书籍推荐，涵盖中英文经典读物。">
    <link rel="canonical" href="https://aimunger.com/resources/books" />
    <meta property="og:title" content="书籍推荐 - aimunger" />
    <meta property="og:description" content="精选投资与商业相关书籍推荐，涵盖中英文经典读物。" />
    <meta property="og:url" content="https://aimunger.com/resources/books" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="aimunger" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px 24px;
            padding-bottom: 72px;
        }
        .book-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .book-cover-wrap {
            position: relative;
            aspect-ratio: 2 / 3;
            border-radius: 6px;
            overflow: hidden;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .book-card:hover .book-cover-wrap {
            box-shadow: 0 8px 24px rgba(139, 37, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.06);
            transform: translateY(-3px);
        }
        .book-cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .book-info {
            padding-top: 12px;
        }
        .book-title-zh {
            font-family: var(--font-serif);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 4px;
            color: var(--color-text);
            transition: color 0.2s ease;
        }
        .book-card:hover .book-title-zh {
            color: var(--color-accent);
        }
        .book-authors {
            font-size: 12px;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        /* Detail overlay */
        .book-detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            justify-content: center;
            align-items: flex-start;
            padding: 60px 24px 40px;
            overflow-y: auto;
        }
        .book-detail-overlay.active {
            display: flex;
        }
        .book-detail-panel {
            background: var(--color-card-bg);
            border-radius: 14px;
            max-width: 640px;
            width: 100%;
            padding: 40px 36px;
            position: relative;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
        }
        .book-detail-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            font-size: 22px;
            color: var(--color-text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
            line-height: 1;
        }
        .book-detail-close:hover {
            color: var(--color-text);
            background: var(--color-surface);
        }
        .book-detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 28px;
        }
        .book-detail-cover {
            width: 120px;
            flex-shrink: 0;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .book-detail-cover img {
            width: 100%;
            display: block;
        }
        .book-detail-meta {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .book-detail-title-zh {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
        }
        .book-detail-title-en {
            font-size: 13px;
            color: var(--color-text-secondary);
            line-height: 1.5;
            margin-bottom: 8px;
            font-style: italic;
        }
        .book-detail-authors {
            font-size: 13px;
            color: var(--color-text-secondary);
        }
        .book-detail-body {
            font-size: 15px;
            line-height: 2;
            color: var(--color-text);
        }
        .book-detail-body p {
            margin-bottom: 14px;
        }
        .book-detail-body p:last-child {
            margin-bottom: 0;
        }
        .book-detail-loading {
            text-align: center;
            padding: 40px 0;
            color: var(--color-text-secondary);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 16px;
                padding-bottom: 56px;
            }
            .book-title-zh {
                font-size: 13px;
            }
            .book-detail-overlay {
                padding: 20px 16px;
            }
            .book-detail-panel {
                padding: 28px 22px;
            }
            .book-detail-header {
                gap: 16px;
            }
            .book-detail-cover {
                width: 90px;
            }
            .book-detail-title-zh {
                font-size: 18px;
            }
            .book-detail-body {
                font-size: 14px;
                line-height: 1.9;
            }
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2876035394247776"
         crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="/" class="logo">
                <span class="logo-icon">M</span>
                <span class="logo-text">aimunger</span>
            </a>
            <ul class="nav-links">
                <li><a href="/resources/" class="active">资料库</a></li>
                <li><a href="/wiki/">Wiki</a></li>
                <li><a href="/blog/">文章</a></li>
                <li><a href="/data/">数据</a></li>
                <li><a href="/ankicard/">记忆卡</a></li>
                <li><a href="/about/">关于</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <section class="hero">
                <h1 class="hero-title">书籍推荐</h1>
                <p class="hero-desc">精选投资、商业与长期思维相关的经典读物。</p>
            </section>

            <div class="books-grid" id="books-grid"></div>
        </div>
    </main>

    <div class="book-detail-overlay" id="book-detail-overlay">
        <div class="book-detail-panel" id="book-detail-panel">
            <button class="book-detail-close" id="book-detail-close" aria-label="关闭">&times;</button>
            <div id="book-detail-content"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="https://aimunger.com/letters/">letters-to-shareholders</a>
                <a href="https://aimunger.com/llm-reader/">llm-reader</a>
                <a href="https://aimunger.com/llm.txt">llm.txt</a>
                <a href="https://aimunger.com/sitemap.xml">sitemap</a>
                <a href="https://aimunger.com/rss.xml">rss</a>
            </div>
            <p>&copy; 2026 aimunger</p>
        </div>
    </footer>

    <script>
    (function() {
        var grid = document.getElementById('books-grid');
        var overlay = document.getElementById('book-detail-overlay');
        var panel = document.getElementById('book-detail-panel');
        var detailContent = document.getElementById('book-detail-content');
        var closeBtn = document.getElementById('book-detail-close');

        fetch('booklists/index.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                var books = data.booklists;
                books.forEach(function(book, i) {
                    var slug = getSlug(book.title_en);
                    var card = document.createElement('a');
                    card.className = 'book-card';
                    card.href = '#';
                    card.setAttribute('data-index', i);
                    card.setAttribute('data-slug', slug);
                    card.innerHTML =
                        '<div class="book-cover-wrap">' +
                            '<img src="booklists/' + escapeAttr(book.cover) + '" alt="' + escapeAttr(book.title_zh) + '" loading="lazy">' +
                        '</div>' +
                        '<div class="book-info">' +
                            '<div class="book-title-zh">' + escapeHtml(book.title_zh) + '</div>' +
                            '<div class="book-authors">' + escapeHtml(book.authors.join(', ')) + '</div>' +
                        '</div>';
                    card.addEventListener('click', function(e) {
                        e.preventDefault();
                        openDetail(book, slug);
                    });
                    grid.appendChild(card);
                });
            });

        function openDetail(book, slug) {
            detailContent.innerHTML =
                '<div class="book-detail-header">' +
                    '<div class="book-detail-cover">' +
                        '<img src="booklists/' + escapeAttr(book.cover) + '" alt="' + escapeAttr(book.title_zh) + '">' +
                    '</div>' +
                    '<div class="book-detail-meta">' +
                        '<div class="book-detail-title-zh">' + escapeHtml(book.title_zh) + '</div>' +
                        '<div class="book-detail-title-en">' + escapeHtml(book.title_en) + '</div>' +
                        '<div class="book-detail-authors">' + escapeHtml(book.authors.join(', ')) + '</div>' +
                    '</div>' +
                '</div>' +
                '<div class="book-detail-body"><div class="book-detail-loading">Loading...</div></div>';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';

            fetch(slug + '.md')
                .then(function(r) {
                    if (!r.ok) throw new Error('Not found');
                    return r.text();
                })
                .then(function(md) {
                    var body = md.replace(/^---[\s\S]*?---\s*/, '');
                    var paragraphs = body.trim().split(/\n\n+/);
                    var html = paragraphs.map(function(p) {
                        return '<p>' + escapeHtml(p.trim()).replace(/\n/g, '<br>') + '</p>';
                    }).join('');
                    detailContent.querySelector('.book-detail-body').innerHTML = html;
                })
                .catch(function() {
                    detailContent.querySelector('.book-detail-body').innerHTML =
                        '<p style="color:var(--color-text-secondary);text-align:center;">暂无详细介绍。</p>';
                });
        }

        function closeDetail() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeDetail);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) closeDetail();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && overlay.classList.contains('active')) closeDetail();
        });

        function getSlug(titleEn) {
            var slugMap = {
                'Santa Monica Partners Letters to Partners 1982-2021: 40 Years of "Pink Sheet" Investing': 'santa-monica-partners',
                'Autopsy of a Merger: Trans Union: The Deal That Rocked the Corporate World': 'autopsy-of-a-merger',
                'Catching a Deckload of Dreams: Chuck Bundrant and the Story of Trident Seafoods': 'catching-a-deckload-of-dreams',
                'Chapters in My Life': 'chapters-in-my-life',
                'Dead Companies Walking: How A Hedge Fund Manager Finds Opportunity in Unexpected Places': 'dead-companies-walking',
                'From Third World to First: The Singapore Story': 'from-third-world-to-first',
                "It's Your Ship: Management Techniques from the Best Damn Ship in the Navy": 'its-your-ship',
                'Legacy: A Biography of Moses and Walter Annenberg': 'legacy-annenberg',
                "McDonald's: Behind the Arches": 'mcdonalds-behind-the-arches',
                'Mellon: An American Life': 'mellon-an-american-life',
                "John D. Rockefeller's Secret Weapon": 'rockefellers-secret-weapon',
                'Plain Talk: Lessons from a Business Maverick': 'plain-talk',
                'Riches Among the Ruins: Adventures in the Dark Corners of the Global Economy': 'riches-among-the-ruins',
                'The Lessons of History': 'lessons-of-history',
                'The Mental Keys to Hitting: A Handbook of Strategies for Performance Enhancement': 'mental-keys-to-hitting',
                'The New Financial Capitalists: Kohlberg Kravis Roberts and the Creation of Corporate Value': 'new-financial-capitalists',
                'The Sleuth Investor': 'sleuth-investor',
                'Ubiquity: Why Catastrophes Happen': 'ubiquity',
                'Working: Researching, Interviewing, Writing': 'working'
            };
            return slugMap[titleEn] || titleEn.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    })();
    </script>
    <script src="/memory-notify.js"></script>
</body>
</html>
