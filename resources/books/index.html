<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>书籍推荐 - aimunger</title>
    <meta name="description" content="精选投资与商业相关书籍推荐，涵盖中英文经典读物。">
    <link rel="canonical" href="https://aimunger.com/resources/books" />
    <meta property="og:title" content="书籍推荐 - aimunger" />
    <meta property="og:description" content="精选投资与商业相关书籍推荐，涵盖中英文经典读物。" />
    <meta property="og:url" content="https://aimunger.com/resources/books" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:site_name" content="aimunger" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=optional" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px 24px;
            padding-bottom: 72px;
        }
        .books-toolbar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }
        .books-search {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            background: var(--color-card-bg);
            color: var(--color-text);
            font-size: 14px;
            line-height: 1.4;
        }
        .books-search:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(139, 37, 0, 0.08);
        }
        #books-total-count {
            color: #8b2500;
        }
        #books-match-summary {
            display: block;
            font-size: 13px;
            color: var(--color-text-secondary);
        }
        .books-empty {
            display: none;
            padding: 28px 0 72px;
            color: var(--color-text-secondary);
            font-size: 14px;
        }
        .book-card {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .book-cover-wrap {
            aspect-ratio: 2 / 3;
            border-radius: 6px;
            overflow: hidden;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .book-card:hover .book-cover-wrap {
            box-shadow: 0 8px 24px rgba(139, 37, 0, 0.10), 0 2px 8px rgba(0, 0, 0, 0.06);
            transform: translateY(-3px);
        }
        .book-cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .book-info {
            padding-top: 12px;
        }
        .book-title-zh {
            font-family: var(--font-serif);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 4px;
            color: var(--color-text);
            transition: color 0.2s ease;
        }
        .book-card:hover .book-title-zh {
            color: var(--color-accent);
        }
        .book-authors {
            font-size: 12px;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }
        @media (max-width: 600px) {
            .books-toolbar {
                margin-bottom: 24px;
            }
            .books-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px 16px;
                padding-bottom: 56px;
            }
            .book-title-zh {
                font-size: 13px;
            }
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2876035394247776"
         crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <nav class="nav container">
            <a href="/" class="logo">
                <span class="logo-icon">M</span>
                <span class="logo-text">aimunger</span>
            </a>
            <ul class="nav-links">
                <li><a href="/resources/" class="active">资料库</a></li>
                <li><a href="/wiki/">Wiki</a></li>
                <li><a href="/blog/">文章</a></li>
                <li><a href="/data/">数据</a></li>
                <li><a href="/ankicard/">记忆卡</a></li>
                <li><a href="/about/">关于</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <div class="container">
            <section class="hero">
                <h1 class="hero-title">书籍推荐</h1>
                <p class="hero-desc">精选投资、商业与长期思维相关的经典读物，共 <span id="books-total-count">0</span> 本。</p>
            </section>

            <section class="books-toolbar" aria-label="书籍搜索">
                <input
                    id="books-search"
                    class="books-search"
                type="search"
                placeholder="搜索中文书名、英文书名或作者"
                autocomplete="off"
                >
                <span id="books-match-summary">正在加载书单...</span>
            </section>

            <div class="books-grid" id="books-grid"></div>
            <div class="books-empty" id="books-empty">没有找到匹配的书籍，请尝试其他关键词。</div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-links">
                <a href="https://aimunger.com/letters/">letters-to-shareholders</a>
                <a href="https://aimunger.com/llm-reader/">llm-reader</a>
                <a href="https://aimunger.com/llm.txt">llm.txt</a>
                <a href="https://aimunger.com/sitemap.xml">sitemap</a>
                <a href="https://aimunger.com/rss.xml">rss</a>
            </div>
            <p>&copy; 2026 aimunger</p>
        </div>
    </footer>

    <script>
    (function() {
        var grid = document.getElementById('books-grid');
        var searchInput = document.getElementById('books-search');
        var totalCount = document.getElementById('books-total-count');
        var matchSummary = document.getElementById('books-match-summary');
        var emptyState = document.getElementById('books-empty');
        var slugMap = {
            'Santa Monica Partners Letters to Partners 1982-2021: 40 Years of "Pink Sheet" Investing': 'santa-monica-partners',
            'Autopsy of a Merger: Trans Union: The Deal That Rocked the Corporate World': 'autopsy-of-a-merger',
            'Catching a Deckload of Dreams: Chuck Bundrant and the Story of Trident Seafoods': 'catching-a-deckload-of-dreams',
            'Chapters in My Life': 'chapters-in-my-life',
            'Dead Companies Walking: How A Hedge Fund Manager Finds Opportunity in Unexpected Places': 'dead-companies-walking',
            'From Third World to First: The Singapore Story': 'from-third-world-to-first',
            "It's Your Ship: Management Techniques from the Best Damn Ship in the Navy": 'its-your-ship',
            'Legacy: A Biography of Moses and Walter Annenberg': 'legacy-annenberg',
            "McDonald's: Behind the Arches": 'mcdonalds-behind-the-arches',
            'Mellon: An American Life': 'mellon-an-american-life',
            "John D. Rockefeller's Secret Weapon": 'rockefellers-secret-weapon',
            'Plain Talk: Lessons from a Business Maverick': 'plain-talk',
            'Riches Among the Ruins: Adventures in the Dark Corners of the Global Economy': 'riches-among-the-ruins',
            'The Lessons of History': 'lessons-of-history',
            'The Mental Keys to Hitting: A Handbook of Strategies for Performance Enhancement': 'mental-keys-to-hitting',
            'The New Financial Capitalists: Kohlberg Kravis Roberts and the Creation of Corporate Value': 'new-financial-capitalists',
            'The Sleuth Investor': 'sleuth-investor',
            'Ubiquity: Why Catastrophes Happen': 'ubiquity',
            'Working: Researching, Interviewing, Writing': 'working',
            'The Small-Cap Advantage: How Top Endowments and Foundations Turn Small Stocks into Big Returns': 'small-cap-advantage',
            'You Can Be a Stock Market Genius: Uncover the Secret Hiding Places of Stock Market Profits': 'stock-market-genius',
            '10½ Lessons from Experience: Perspectives on Fund Management': 'ten-and-a-half-lessons',
            'Better Thinking, Better Results: Case Study and Analysis of an Enterprise-Wide Lean Transformation': 'better-thinking-better-results',
            "The Investor's Mind: The Pause Framework for Better Decisions": 'investors-mind',
            'The Origin of Capitalism: A Longer View': 'origin-of-capitalism',
            'Power Failure: The Rise and Fall of an American Icon': 'power-failure',
            'The Way It Was: An Oral History of Finance 1967–1987': 'way-it-was',
            'Lights Out: Pride, Delusion, and the Fall of General Electric': 'lights-out',
            'The Smartest Guys in the Room: The Amazing Rise and Scandalous Fall of Enron': 'smartest-guys-in-the-room',
            'Beat the Dealer: A Winning Strategy for the Game of Twenty-One': 'beat-the-dealer',
            'When Genius Failed: The Rise and Fall of Long-Term Capital Management': 'when-genius-failed',
            "Fatal Risk: A Cautionary Tale of AIG's Corporate Suicide": 'fatal-risk',
            'Big Bets Gone Bad: Derivatives and Bankruptcy in Orange County': 'big-bets-gone-bad',
            'All the Devils Are Here: The Hidden History of the Financial Crisis': 'all-the-devils-are-here',
            'Paying with Plastic: The Digital Revolution in Buying and Borrowing': 'paying-with-plastic',
            'The Oligarchs: Wealth and Power in the New Russia': 'oligarchs',
            "Cuthbert Heath: The Maker of Modern Lloyd's": 'cuthbert-heath',
            'The Outsiders: Eight Unconventional CEOs and Their Radically Rational Blueprint for Success': 'outsiders',
            'The Art of War': 'art-of-war',
            'A Man on the Moon: The Voyages of the Apollo Astronauts': 'man-on-the-moon',
            'The Warren Buffett Way': 'warren-buffett-way',
            'Investing: The Last Liberal Art': 'investing-last-liberal-art',
            'The Infinity Machine: Demis Hassabis, DeepMind, and the Quest for Superintelligence': 'infinity-machine',
            "Runnin' Down a Dream: How to Thrive in a Career You Actually Love": 'runnin-down-a-dream',
            "Poor Charlie's Almanack: The Essential Wit and Wisdom of Charles T. Munger": 'poor-charlies-almanack',
            'Personal History': 'personal-history',
            'Titan: The Life of John D. Rockefeller, Sr.': 'titan',
            'The House of Morgan: An American Banking Dynasty and the Rise of Modern Finance': 'house-of-morgan',
            'Tao Te Ching': 'tao-te-ching',
            'Margin of Safety: Risk-Averse Value Investing Strategies for the Thoughtful Investor': 'margin-of-safety',
            'The Most Important Thing: Uncommon Sense for the Thoughtful Investor': 'most-important-thing',
            'The Essays of Warren Buffett: Lessons for Corporate America': 'essays-of-warren-buffett',
            'Zen and the Art of Motorcycle Maintenance: An Inquiry into Values': 'zen-motorcycle-maintenance',
            "Richer, Wiser, Happier: How the World's Greatest Investors Win in Markets and Life": 'richer-wiser-happier',
            'Meditations': 'meditations',
            'Letters from a Stoic': 'letters-from-a-stoic',
            'Fooled by Randomness: The Hidden Role of Chance in Life and in the Markets': 'fooled-by-randomness',
            'Competitive Strategy: Techniques for Analyzing Industries and Competitors': 'competitive-strategy',
            'Thinking, Fast and Slow': 'thinking-fast-and-slow',
            "Stock Market Maestros: Winning Habits, Strategies and Mindsets of Britain's Best Investors": 'stock-market-maestros',
            "Stock Picker: A Microcap Investor's Guide to Money, Discipline, and Edge": 'stock-picker',
            'Quality of Earnings: The Investor\'s Guide to How Much Money A Company Is Really Making': 'quality-of-earnings',
            "What's Behind the Numbers?: A Guide to Exposing Financial Chicanery and Avoiding Huge Losses in Your Portfolio": 'whats-behind-the-numbers',
            'The Basics of Understanding Financial Statements': 'basics-financial-statements',
            'The End of Accounting and the Path Forward for Investors and Managers': 'end-of-accounting',
            'The CFO Guidebook': 'cfo-guidebook',
            'The Accounting Game: Basic Accounting Fresh from the Lemonade Stand': 'accounting-game',
            'Accounting for Value': 'accounting-for-value',
            'How to Read a Financial Report: Wringing Vital Signs Out of the Numbers': 'how-to-read-financial-report',
            'The Interpretation of Financial Statements': 'interpretation-financial-statements',
            'Analysis for Financial Management': 'analysis-financial-management',
            'Financial Statement Analysis and Security Valuation': 'financial-statement-analysis-penman',
            'Financial Shenanigans: How to Detect Accounting Gimmicks & Fraud in Financial Reports': 'financial-shenanigans',
            'Understanding Corporate Reports: A Guide to Financial Statement Analysis': 'understanding-corporate-reports',
            'Advanced Accounting': 'advanced-accounting-bernstein',
            'Financial Statement Analysis: Theory, Application, and Interpretation': 'financial-statement-analysis-bernstein'
        };
        var books = [];

        fetch('booklists/index.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                books = data.booklists.map(function(book) {
                    return {
                        title_zh: book.title_zh,
                        title_en: book.title_en,
                        authors: book.authors || [],
                        cover: book.cover,
                        slug: slugMap[book.title_en] || '',
                        searchable: normalize([
                            book.title_zh,
                            book.title_en,
                            (book.authors || []).join(' ')
                        ].join(' '))
                    };
                });
                totalCount.textContent = String(books.length);
                renderBooks('');
            })
            .catch(function() {
                matchSummary.textContent = '书单加载失败，请稍后重试。';
                emptyState.style.display = 'block';
            });

        searchInput.addEventListener('input', function(e) {
            renderBooks(e.target.value || '');
        });

        function renderBooks(query) {
            var normalizedQuery = normalize(query);
            var filtered = books.filter(function(book) {
                return !normalizedQuery || book.searchable.indexOf(normalizedQuery) !== -1;
            });

            grid.innerHTML = '';
            filtered.forEach(function(book) {
                var card = document.createElement('a');
                card.className = 'book-card';
                card.href = '/resources/books/' + book.slug;
                card.innerHTML =
                    '<div class="book-cover-wrap">' +
                        '<img src="booklists/' + esc(book.cover) + '" alt="' + esc(book.title_zh) + '" loading="lazy">' +
                    '</div>' +
                    '<div class="book-info">' +
                        '<div class="book-title-zh">' + esc(book.title_zh) + '</div>' +
                        '<div class="book-authors">' + esc(book.authors.join(', ')) + '</div>' +
                    '</div>';
                grid.appendChild(card);
            });

            if (normalizedQuery) {
                matchSummary.textContent = '共 ' + books.length + ' 本，当前匹配 ' + filtered.length + ' 本';
            } else {
                matchSummary.textContent = '可按中文书名、英文书名或作者搜索';
            }

            emptyState.style.display = filtered.length ? 'none' : 'block';
        }

        function normalize(s) {
            return String(s || '').toLowerCase().trim();
        }

        function esc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    })();
    </script>
    <script src="/memory-notify.js"></script>
</body>
</html>
